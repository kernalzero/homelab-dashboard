<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homelab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='4' width='18' height='6' rx='1.5' fill='%2360a5fa'/><rect x='3' y='14' width='18' height='6' rx='1.5' fill='%2334d399'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 id="title">Homelab</h1>
      <div id="pills" class="pills"></div>
    </div>
    <div class="top-right">
      <input id="search" type="search" placeholder="Search services  /" autocomplete="off">
      <div class="clock"><span id="time"></span><span id="date"></span></div>
    </div>
  </header>

  <main>
    <section class="widgets" id="widgets"></section>

    <section>
      <div class="section-head"><h2>Services</h2><span id="svc-summary" class="muted"></span></div>
      <div id="services"></div>
    </section>

    <section class="panels">
      <div class="panel" id="panel-guests"></div>
      <div class="panel" id="panel-network"></div>
      <div class="panel" id="panel-storage"></div>
    </section>
  </main>

  <footer class="muted" id="footer"></footer>
  <script src="/static/app.js"></script>
</body>
</html>
